<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruckus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Figtree:wght@400;500;600;700&family=Martian+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Shared "inked line" filter: gives Rudy a slightly wobbly, hand-drawn outline. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="wobble" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence id="wobble-noise" type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="1" result="noise"></feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
    </filter>
  </defs>
</svg>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#trade" aria-label="Ruckus home">
      <span class="brand-badge" id="brand-badge"></span>
      <span class="wordmark">ruckus</span>
    </a>
    <nav class="nav" id="nav" aria-label="Main">
      <a href="#trade">Trade</a>
      <a href="#tokens">Tokens</a>
      <a href="#den">The Den</a>
      <a href="#launch">Launch</a>
      <a href="#rewards">Rewards</a>
      <a href="#tasks">Tasks</a>
      <a href="#stats">Stats</a>
    </nav>
    <div class="top-actions">
      <button class="icon-btn" id="theme-btn" type="button" aria-label="Switch theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
      </button>
      <button class="btn btn-primary" id="wallet-btn" type="button">Connect wallet</button>
    </div>
  </div>
</header>

<div class="ticker" id="ticker" aria-label="Market prices"></div>
<div class="demo-banner" id="mode-banner"></div>

<main class="wrap" id="view"></main>

<footer class="foot">
  <div class="foot-inner">
    <span>ruckus · trades after dark · 0% platform fee · swaps by Jupiter</span>
    <nav aria-label="Footer">
      <a href="#launch">Launch</a>
      <a href="#rewards">Rewards</a>
      <a href="#tasks">Tasks</a>
      <a href="#stats">Stats</a>
      <a href="https://solana.com" target="_blank" rel="noopener">Built on Solana</a>
    </nav>
  </div>
</footer>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>

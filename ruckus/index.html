<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruckus</title>
<meta name="description" content="Find Solana coins first, follow the wallets that find them, and trade in one tap. Hosted by Rudy the raccoon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="#home" aria-label="Ruckus home">
      <span class="brand-rudy" id="brand-rudy"></span>
      <span class="wordmark">ruckus</span>
    </a>
    <nav class="nav" id="nav" aria-label="Main">
      <a href="#trade">Trade</a>
      <a href="#coins">Coins</a>
      <a href="#den">Den</a>
      <a href="#launch">Launch</a>
      <a href="#wallet">Wallet</a>
      <a href="#rewards">Rewards</a>
      <a href="#pulse">Pulse</a>
    </nav>
    <div class="gsearch" id="gsearch">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input id="gs-input" type="search" placeholder="Search coins, wallets, mint address" autocomplete="off" aria-label="Search coins and wallets" aria-controls="gs-results">
      <kbd>/</kbd>
      <div class="gs-results" id="gs-results" role="listbox" hidden></div>
    </div>
    <div class="top-actions">
      <button class="icon-btn search-toggle" id="search-btn" type="button" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      </button>
      <span class="chain-pill"><span class="sol-dot" aria-hidden="true"></span>Solana</span>
      <button class="icon-btn" id="theme-btn" type="button" aria-label="Switch light or dark theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
      </button>
      <button class="btn btn-primary" id="wallet-btn" type="button">Connect</button>
    </div>
  </div>
</header>

<main id="view"></main>

<footer class="status" id="status" aria-label="Market status"></footer>

<nav class="tabbar" id="tabbar" aria-label="App">
  <a href="#trade"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"></path><path d="M14 7h7v7"></path></svg>Trade</a>
  <a href="#coins"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="9" r="6"></circle><path d="M15.5 9.5a6 6 0 1 1-6 6"></path></svg>Coins</a>
  <a href="#den"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>Den</a>
  <a href="#launch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c4 3 5 7 4 11H8C7 10 8 6 12 3z"></path><path d="M8 14l-3 4h4M16 14l3 4h-4M10 18l2 3 2-3"></path></svg>Launch</a>
  <a href="#wallet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"></rect><path d="M16 12.5h2"></path><path d="M3 9h15V6"></path></svg>Wallet</a>
</nav>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>

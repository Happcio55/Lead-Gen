# Deploy on Render: dashboard.render.com/blueprint/new -> pick this repo and branch -> Apply.
services:
  - type: web
    name: kairo
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /api/health
    disk:
      name: kairo-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RPC_URLS
        sync: false
      - key: RELAY_API_KEY
        sync: false
